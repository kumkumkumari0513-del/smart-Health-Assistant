<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Health Assistant</title>
<style>
:root{--bg:#f4f9ff;--card:#fff;--tx:#12263a;--mu:#5b7186;--pr:#2f8fe6;--pl:#e3f1ff;--bd:#d6e6f5;--ok:#1e9e6a;--er:#d6363f;--erl:#fdecee;--wn:#fff6e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--card:#15263a;--tx:#e6f0fa;--mu:#9ab0c6;--pr:#5aaaf2;--pl:#1b3550;--bd:#27415c;--erl:#3a1d22;--wn:#3a3219;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a26;--card:#15263a;--tx:#e6f0fa;--mu:#9ab0c6;--pr:#5aaaf2;--pl:#1b3550;--bd:#27415c;--erl:#3a1d22;--wn:#3a3219;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0 0 .5rem}p{margin:.3rem 0}
.app{display:flex;min-height:100vh}
aside{width:220px;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.logo{font-weight:700;color:var(--pr);padding:4px 10px 14px;font-size:18px}
aside a{display:block;padding:10px 12px;border-radius:10px;color:var(--tx);text-decoration:none;margin-bottom:2px}
aside a.on,aside a:hover{background:var(--pl);color:var(--pr)}
main{flex:1;padding:24px;max-width:900px;width:100%;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat b{font-size:26px;color:var(--pr);display:block}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px}
button,.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;margin-top:12px}
button.sec{background:var(--pl);color:var(--pr)}button:disabled{opacity:.6}
.alert{padding:12px 14px;border-radius:10px;margin:10px 0;font-size:15px}
.emg{background:var(--erl);border:1px solid var(--er)}.warn{background:var(--wn);border:1px solid #e6c34a}.okm{background:var(--pl);border:1px solid var(--pr)}
.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px}
.m{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--pr);color:#fff}.m.b{align-self:flex-start;background:var(--pl)}
.row{display:flex;gap:8px}.row input{flex:1}.row button{margin-top:0}
.sp{width:18px;height:18px;border:3px solid var(--pl);border-top-color:var(--pr);border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.hero{text-align:center;padding:40px 10px}.hero h1{font-size:clamp(28px,6vw,44px)}
.hero span{color:var(--pr)}.tag{font-size:12px;background:var(--pl);color:var(--pr);padding:2px 8px;border-radius:99px}
mark{background:var(--pl);color:var(--pr);border-radius:4px;padding:0 3px}
.hero-img{width:100%;max-height:300px;object-fit:cover;border-radius:16px;margin:14px 0}
.auth{display:grid;grid-template-columns:1fr 1fr;max-width:880px;margin:auto;border-radius:16px;overflow:hidden;border:1px solid var(--bd);background:var(--card)}
.auth .side{background:#0e2a47 center/cover;color:#fff;padding:24px;display:flex;align-items:flex-end;min-height:380px}
.auth .frm{padding:22px}
@media(max-width:760px){.auth{grid-template-columns:1fr}.auth .side{min-height:170px}}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px}
.c-ok{background:#dff5ec;color:#11724c}.c-w{background:#fff0c9;color:#8a6200}.c-r{background:#fde0e2;color:#a3202a}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}.tw{overflow-x:auto}
aside a[href="#emergency"]{color:var(--er);font-weight:600}.sos{display:flex;gap:10px;flex-wrap:wrap}.sos a{flex:1;text-align:center;min-width:140px;margin-top:0}.btn.red{background:var(--er)}
.top{display:none}
@media(max-width:760px){.app{display:block}aside{position:fixed;left:-240px;z-index:9;transition:left .2s;height:100%;top:0;padding-top:calc(16px + env(safe-area-inset-top,0px))}aside.open{left:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
main{padding:14px}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:10px;z-index:20}
</style>
</head>
<body>
<div class="top"><button class="sec" style="margin:0" id="mb">☰</button><b style="color:var(--pr)">Smart Health Assistant</b></div>
<div class="app" id="app"></div>
<script>
var PAGES=[["emergency","🚨 Emergency"],["vitals","❤️ Vitals"],["dashboard","🏠 Dashboard"],["chat","💬 AI Chatbot"],["symptoms","🩺 Symptom Checker"],["medicine","💊 Medicine Info"],["reports","📄 Report Analyzer"],["appointments","📅 Appointments"],["profile","👤 Profile"]];
var DISC="⚠️ General educational information only. This is not a medical diagnosis. Please consult a qualified doctor.";
var EMG=["chest pain","can’t breathe","cannot breathe","difficulty breathing","shortness of breath","unconscious","fainted","seizure","stroke","slurred speech","face drooping","severe bleeding","vomiting blood","blood in stool","suicid","poison","overdose","severe allergic","swelling of face","confusion","paralysis","sudden weakness","worst headache","chest pressure","can't breathe"];
var EMGMSG="🚨 These could be emergency warning signs. Please call your local emergency number (India: 112 / ambulance 108) or go to the nearest hospital right now. Do not wait for online advice.";
var TIPS={fever:"Rest, drink plenty of fluids and monitor temperature. See a doctor if fever lasts more than 3 days, is very high, or occurs in infants or older adults.",cough:"Warm fluids and rest may soothe a cough. See a doctor if it lasts over 2 weeks, brings up blood, or comes with breathlessness.",headache:"Rest in a quiet room, stay hydrated and limit screens. Seek care if it is sudden and severe, follows a head injury, or comes with vision changes or stiff neck.",stomach:"Sip fluids or oral rehydration solution and eat light food. Seek care for blood, severe pain, high fever or signs of dehydration.",cold:"Rest, fluids and steam may help. Most colds improve within a week; see a doctor if symptoms worsen.",rash:"Avoid scratching and new products on the skin. See a doctor if it spreads fast, blisters, or comes with fever or swelling.",tired:"Check sleep, food, stress and hydration. Persistent tiredness deserves a doctor visit and possibly blood tests.",throat:"Warm fluids and rest help. See a doctor if swallowing is very painful or it lasts over a week."};
var KEYS={fever:["fever","temperature","chills"],cough:["cough"],headache:["headache","migraine"],stomach:["stomach","vomit","nausea","diarrhea","diarrhoea","loose motion","abdominal"],cold:["cold","runny nose","sneez","congestion"],rash:["rash","itch"],tired:["tired","fatigue","weakness"],throat:["sore throat","throat"]};
var MEDS={paracetamol:{u:"Commonly used for mild pain and fever.",p:"Too much can harm the liver. Check other medicines for hidden paracetamol. Avoid alcohol. Ask a doctor if you have liver disease."},ibuprofen:{u:"An NSAID used for pain, inflammation and fever.",p:"Can irritate the stomach and affect kidneys. Usually taken with food. People with ulcers, asthma, kidney or heart problems, or pregnancy should ask a doctor first."},cetirizine:{u:"An antihistamine used for allergy symptoms such as sneezing and itching.",p:"May cause drowsiness. Be careful with driving. Ask a doctor in pregnancy or kidney disease."},omeprazole:{u:"Reduces stomach acid; used for acidity, reflux and ulcers.",p:"Long-term use should be supervised by a doctor. May affect absorption of some nutrients."},ors:{u:"Oral rehydration salts replace fluids and salts lost in diarrhoea or vomiting.",p:"Mix exactly as the packet says with clean water. Seek care if dehydration is severe or in small infants."},amoxicillin:{u:"A prescription antibiotic for certain bacterial infections.",p:"Only a doctor can decide if you need it. Never self-medicate with antibiotics. Tell your doctor about penicillin allergy."}};
var GLOS={hemoglobin:"Protein in red blood cells that carries oxygen. Low levels can relate to anaemia.",wbc:"White blood cells fight infection. High or low counts may point to infection or other conditions.",rbc:"Red blood cells carry oxygen around the body.",platelets:"Cell fragments that help blood clot.",glucose:"Blood sugar level. Persistently high values are checked for diabetes.",hba1c:"Average blood sugar over about 3 months.",cholesterol:"A fat in the blood. High levels raise heart-disease risk over time.",ldl:"‘Bad’ cholesterol; lower is generally better.",hdl:"‘Good’ cholesterol; higher is generally better.",triglycerides:"A type of blood fat; high levels are linked to heart risk.",creatinine:"A waste product used to check kidney function.",tsh:"Thyroid stimulating hormone; checks thyroid function.",bilirubin:"A yellow pigment processed by the liver.",urea:"A waste product that helps assess kidney function."};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ld(k,d){try{var v=localStorage.getItem(K(k));return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}}
function toast(t,bad){var d=document.createElement("div");d.className="toast";if(bad)d.style.background="#d6363f";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function isEmg(t){t=t.toLowerCase();return EMG.some(function(k){return t.indexOf(k)>-1})}
function tipsFor(t){t=t.toLowerCase();var o=[];for(var k in KEYS){if(KEYS[k].some(function(w){return t.indexOf(w)>-1}))o.push(TIPS[k])}return o}
var user=null,chat=[{b:1,t:"Hi! I’m your health assistant. Describe your symptoms or ask a health question.\n\n"+DISC}];
function page(){return(location.hash||"#home").slice(1)}
function shell(inner){var nav=navPages().map(function(p){return '<a href="#'+p[0]+'" class="'+(page()==p[0]?"on":"")+'">'+p[1]+'</a>'}).join("");
return '<aside id="sb"><div class="logo">➕ SmartHealth</div>'+nav+'<a href="#" id="lo">🚪 Log out</a><a href="#" id="th">🌓 Theme</a></aside><main>'+inner+'</main>'}
function render(){var p=page(),app=$("#app");
if(user&&p!="home"&&p!="login"&&p!="register"){if(user.role=="admin"&&p!="admin"&&p!="profile"){location.hash="#admin";return}if(user.role!="admin"&&p=="admin"){location.hash="#vitals";return}}
if(!user&&p!="home"&&p!="login"&&p!="register"){location.hash="#login";return}
if(user&&(p=="login"||p=="register")){location.hash=user.role=="admin"?"#admin":"#vitals";return}
if(p=="home"||(!user&&p!="login"&&p!="register")){app.innerHTML='<main><div class="hero"><h1>Your <span>Smart Health</span> Assistant</h1><p style="color:var(--mu)">Check symptoms, track BP, pulse and oxygen, decode reports and manage appointments.</p><a class="btn" href="#'+(user?(user.role=="admin"?"admin":"vitals"):"register")+'">'+(user?"Open app":"Get started")+'</a> '+(user?"":'<a class="btn sec" href="#login">Login</a>')+'</div><img class="hero-img" src="'+IMG1+'" alt="Digital healthcare network"><div class="grid"><div class="card">🩺 <b>Symptom Checker</b><p>Emergency warning detection.</p></div><div class="card">❤️ <b>Vitals</b><p>BP, pulse, SpO₂ tracking.</p></div><div class="card">📄 <b>Reports</b><p>Medical terms explained.</p></div></div><div class="alert warn">'+DISC+'</div></main>';return}
if(p=="login"||p=="register"){var reg=p=="register";
app.innerHTML='<main><div class="auth"><div class="side" id="sd"><div><h2>Smart Health Assistant</h2><p>Symptoms, vitals, reports and appointments in one place.</p></div></div><div class="frm"><h2>'+(reg?"Create account":"Welcome back")+'</h2>'+(reg?'':'<div class="row" style="margin-bottom:8px"><button type="button" class="'+(ROLE=="user"?"":"sec")+'" id="tu" style="margin:0;flex:1">👤 User Login</button><button type="button" class="'+(ROLE=="admin"?"":"sec")+'" id="tk" style="margin:0;flex:1">🛡️ Admin Login</button></div>')+'<form id="af">'+(reg?'<label>Name</label><input id="nm" required minlength="2" maxlength="60">':'')+'<label>Email</label><input id="em" type="email" required autocapitalize="off" autocomplete="username" spellcheck="false"><label>Password</label><input id="pw" type="password" required minlength="8" autocomplete="off" autocapitalize="off"><label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="sp" style="width:auto">Show password</label><button>'+(reg?"Register":"Login")+'</button></form>'+(reg?'':'<div class="alert okm" style="font-size:14px;margin-top:14px"><b>Demo logins</b> (type them, or tap Fill and then press Login)<br>'+(ROLE=="admin"?"Admin: admin@health.com / Admin@123":"User: user@health.com / User@123")+'<br><button type="button" class="sec" id="du" style="padding:4px 10px">Fill</button></div>')+'<p style="font-size:13px;color:var(--mu)">Prototype: data stays in your browser. The full version uses bcrypt and JWT on the server.</p><a href="#'+(reg?"login":"register")+'">'+(reg?"Have an account? Login":"New here? Register")+'</a></div></div></main>';
$("#sd").style.backgroundImage='linear-gradient(rgba(14,42,71,.4),rgba(14,42,71,.85)),url("'+IMG2+'")';

if(!reg){$("#du").onclick=function(){var a=ROLE=="admin";$("#em").value=a?"admin@health.com":"user@health.com";$("#pw").value=a?"Admin@123":"User@123"};$("#tu").onclick=function(){ROLE="user";render()};$("#tk").onclick=function(){ROLE="admin";render()}}
$("#sp").onchange=function(){$("#pw").type=this.checked?"text":"password"};
$("#af").onsubmit=function(e){e.preventDefault();LG(e,reg).catch(function(x){toast("Login error: "+x.message,1)})};
async function LG(e,reg){if(Date.now()<LOCK){toast("Too many wrong attempts. Wait "+Math.ceil((LOCK-Date.now())/1000)+" seconds",1);return}var em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value,u=null,ac=ld("sha_accts",{});
if(reg){if(DEMO[em]||ac[em]){toast("Email already registered",1);return}ac[em]={h:await H(pw),name:$("#nm").value.trim()};sv("sha_accts",ac);u={email:em,name:ac[em].name,role:"user"}}
else{var d=DEMO[em];if(d&&d.h===await H(pw))u={email:em,name:d.name,role:d.role};else if(ac[em]&&ac[em].h===await H(pw))u={email:em,name:ac[em].name,role:"user"}}
if(!u){FAILS++;if(FAILS>=5){LOCK=Date.now()+30000;FAILS=0}toast("Wrong email or password",1);return}FAILS=0;if(!reg&&u.role!=ROLE){toast(ROLE=="admin"?"This is not an admin account. Use the User Login tab.":"This is an admin account. Use the Admin Login tab.",1);return}
user=u;var pf=ld("sha_prof",{});["age","height","weight","blood"].forEach(function(k){user[k]=pf[k]||""});touch();
if(em=="user@health.com"&&!ld("sha_vit",null))sv("sha_vit",SEED);
location.hash=u.role=="admin"?"#admin":"#vitals";render()};return}
var v=VIEWS[p]||VIEWS.dashboard;app.innerHTML=shell(v());if(AFTER[p])AFTER[p]();
$("#lo").onclick=function(e){e.preventDefault();user=null;try{localStorage.removeItem("sha_user")}catch(x){}location.hash="#home";render()};
$("#th").onclick=function(e){e.preventDefault();var d=document.documentElement,dark=getComputedStyle(d).colorScheme=="dark";d.setAttribute("data-theme",dark?"light":"dark")};}
var VIEWS={},AFTER={};
function bmi(){var h=+user.height/100,w=+user.weight;return h&&w?(w/(h*h)).toFixed(1):"-"}
VIEWS.dashboard=function(){var h=ld("sha_hist",[]),a=ld("sha_appt",[]),up=a.filter(function(x){return x.d>=new Date().toISOString().slice(0,10)});
return '<img class="hero-img" style="max-height:150px" src="'+IMG2+'" alt=""><h2>Hello, '+esc(user.name)+' 👋</h2><div class="grid"><div class="card stat"><b>'+h.length+'</b>Symptom checks</div><div class="card stat"><b>'+up.length+'</b>Upcoming appointments</div><div class="card stat"><b>'+bmi()+'</b>BMI</div><div class="card stat"><b>'+lastBP()+'</b>Last BP</div><div class="card stat"><b>'+esc(user.blood||"-")+'</b>Blood group</div></div><div class="card"><h3>Recent symptom checks</h3>'+(h.length?h.slice(-5).reverse().map(function(x){return '<p>'+(x.e?'🚨 ':'• ')+esc(x.s)+' <span class="tag">'+esc(x.date)+'</span></p>'}).join(""):'<p style="color:var(--mu)">No checks yet.</p>')+'</div><div class="alert warn">'+DISC+'</div>'};
VIEWS.chat=function(){return '<h2>AI Health Chatbot</h2><div class="alert okm">Prototype mode: rule-based replies. The full version sends messages to Gemini through your Express backend.</div><div class="card"><div class="chat" id="cl"></div><form class="row" id="cf"><input id="ci" placeholder="Describe your symptoms…" required><button>Send</button></form></div>'};
function drawChat(){$("#cl").innerHTML=chat.map(function(m){return '<div class="m '+(m.b?"b":"u")+'">'+esc(m.t)+'</div>'}).join("");$("#cl").scrollTop=1e6}
AFTER.chat=function(){drawChat();$("#cf").onsubmit=function(e){e.preventDefault();var t=$("#ci").value.trim();if(!t)return;chat.push({t:t});$("#ci").value="";drawChat();var cl=$("#cl");cl.insertAdjacentHTML("beforeend",'<div class="m b"><span class="sp"></span></div>');cl.scrollTop=1e6;
setTimeout(function(){var r;if(isEmg(t))r=EMGMSG;else{var tp=tipsFor(t);r=(tp.length?tp.join("\n\n"):"I can share general information, but I need more detail. How long have you had the symptoms and how severe are they?")+medText(t)+"\n\nNext steps: monitor symptoms, rest, and see a doctor if they worsen or persist.\n\n"+DISC}chat.push({b:1,t:r});drawChat()},700)}};
VIEWS.symptoms=function(){return '<h2>Symptom Checker</h2><div class="card"><form id="sf"><label>Symptoms</label><textarea id="ss" required placeholder="e.g. fever and sore throat since two days"></textarea><div class="grid"><div><label>Age</label><input id="sa" type="number" min="0" max="120" required value="'+esc(user.age)+'"></div><div><label>Duration (days)</label><input id="sd" type="number" min="0" max="365" required></div><div><label>Severity</label><select id="sv"><option>Mild</option><option>Moderate</option><option>Severe</option></select></div></div><button>Check</button></form></div><div id="sr"></div>'};
AFTER.symptoms=function(){$("#sf").onsubmit=function(e){e.preventDefault();var s=$("#ss").value.trim(),age=+$("#sa").value,d=+$("#sd").value,sev=$("#sv").value,em=isEmg(s)||(sev=="Severe"&&age<2),o="";
if(em)o='<div class="alert emg"><b>'+EMGMSG+'</b></div>';else{var tp=tipsFor(s);o='<div class="card"><h3>General guidance</h3>'+(tp.length?tp.map(function(x){return '<p>• '+x+'</p>'}).join(""):'<p>No specific pattern recognised. Rest, hydrate and monitor.</p>')+(d>=7||sev=="Severe"?'<div class="alert warn">Symptoms that are severe or last a week or more should be checked by a doctor.</div>':'')+(age<5||age>65?'<div class="alert warn">Children under 5 and adults over 65 can get worse quickly. Consider a doctor visit sooner.</div>':'')+'</div>'+medCard(s,age)+infoCard(s,age)}
$("#sr").innerHTML=o+'<div class="alert warn">'+DISC+'</div>';var h=ld("sha_hist",[]);h.push({s:s,e:em,date:new Date().toLocaleDateString()});sv("sha_hist",h)}};
VIEWS.medicine=function(){return '<h2>Medicine Information</h2><div class="card"><form class="row" id="mf"><input id="mi" list="ml" placeholder="Enter medicine name" required><datalist id="ml">'+Object.keys(MEDS).map(function(k){return '<option value="'+k+'">'}).join("")+'</datalist><button>Search</button></form><p style="color:var(--mu);font-size:14px">Prototype knows: '+Object.keys(MEDS).join(", ")+'. Full version uses Gemini for any name.</p></div><div id="mr"></div>'};
AFTER.medicine=function(){$("#mf").onsubmit=function(e){e.preventDefault();var k=$("#mi").value.trim().toLowerCase(),m=MEDS[k];$("#mr").innerHTML=m?'<div class="card"><h3>'+esc(k)+'</h3><p><b>Common use:</b> '+m.u+'</p><p><b>Precautions:</b> '+m.p+'</p><div class="alert warn">I never suggest dosages. Follow your doctor’s or pharmacist’s instructions.</div></div>':'<div class="alert warn">Not in the prototype list. Ask a pharmacist or doctor.</div>'}};
VIEWS.reports=function(){return '<h2>Health Report Analyzer</h2><div class="card"><p style="color:var(--mu)">Paste report text or upload a .txt file. It is processed in your browser only. (Full version reads PDFs and images via Gemini.)</p><input type="file" id="rf" accept=".txt"><label>Report text</label><textarea id="rt" placeholder="Hemoglobin 11.2 g/dL&#10;WBC 7800&#10;Glucose 118 mg/dL"></textarea><button id="rb">Explain terms</button></div><div id="rr"></div>'};
AFTER.reports=function(){$("#rf").onchange=function(){var f=this.files[0];if(!f)return;if(f.size>1e6){toast("File too large");return}var r=new FileReader();r.onload=function(){$("#rt").value=r.result};r.readAsText(f)};
$("#rb").onclick=function(){var t=$("#rt").value,l=t.toLowerCase(),f=Object.keys(GLOS).filter(function(k){return l.indexOf(k)>-1});
$("#rr").innerHTML=(f.length?'<div class="card"><h3>Terms found</h3>'+f.map(function(k){return '<p><mark>'+k+'</mark> '+GLOS[k]+'</p>'}).join("")+'</div>':'<div class="alert warn">No known terms found.</div>')+'<div class="alert warn">I can’t say whether your values are normal for you. Please show the report to a qualified doctor. Reports are confidential.</div>'}};
VIEWS.appointments=function(){return '<h2>Appointments</h2><div class="card"><form id="pf"><div class="grid"><div><label>Doctor</label><input id="pd" required maxlength="60"></div><div><label>Date</label><input id="pt" type="date" required></div><div><label>Time</label><input id="pm" type="time" required></div></div><label>Notes</label><input id="pn" maxlength="120"><button>Save appointment</button></form></div><div class="card"><h3>Upcoming</h3><div id="pl"></div></div>'};
AFTER.appointments=function(){function draw(){var a=ld("sha_appt",[]).map(function(x,i){x.i=i;return x}).filter(function(x){return x.d>=new Date().toISOString().slice(0,10)}).sort(function(x,y){return (x.d+x.t)<(y.d+y.t)?-1:1});$("#pl").innerHTML=a.length?a.map(function(x){return '<p>📅 <b>'+esc(x.n)+'</b> · '+esc(x.d)+' '+esc(x.t)+' '+esc(x.o)+' <button class="sec" style="margin:0;padding:2px 10px" data-i="'+x.i+'">Delete</button></p>'}).join(""):'<p style="color:var(--mu)">None yet.</p>'}
draw();$("#pf").onsubmit=function(e){e.preventDefault();var a=ld("sha_appt",[]);a.push({n:$("#pd").value.trim(),d:$("#pt").value,t:$("#pm").value,o:$("#pn").value.trim()});sv("sha_appt",a);this.reset();toast("Appointment saved ✓");draw()};
$("#pl").onclick=function(e){var i=e.target.getAttribute("data-i");if(i===null)return;var a=ld("sha_appt",[]);a.splice(+i,1);sv("sha_appt",a);draw()}};
VIEWS.profile=function(){return '<h2>Profile</h2><div class="card"><form id="uf"><label>Name</label><input id="un" required value="'+esc(user.name)+'"><div class="grid"><div><label>Age</label><input id="ua" type="number" min="0" max="120" value="'+esc(user.age)+'"></div><div><label>Height (cm)</label><input id="uh" type="number" min="30" max="250" value="'+esc(user.height)+'"></div><div><label>Weight (kg)</label><input id="uw" type="number" min="2" max="300" value="'+esc(user.weight)+'"></div><div><label>Blood group</label><select id="ub">'+["","A+","A-","B+","B-","AB+","AB-","O+","O-"].map(function(b){return '<option'+(b==user.blood?" selected":"")+'>'+b+'</option>'}).join("")+'</select></div></div><button>Save</button></form></div>'};
AFTER.profile=function(){$("#uf").onsubmit=function(e){e.preventDefault();user.name=$("#un").value.trim();user.age=$("#ua").value;user.height=$("#uh").value;user.weight=$("#uw").value;user.blood=$("#ub").value;sv("sha_prof",{age:user.age,height:user.height,weight:user.weight,blood:user.blood});toast("Profile saved ✓")}};
